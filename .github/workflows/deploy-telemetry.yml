name: Deploy OS Telemetry Service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "services/telemetry/**"
      - ".github/workflows/deploy-telemetry.yml"
  workflow_dispatch:

concurrency:
  group: deploy-telemetry
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via Tailscale to VPS
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository in the GitHub runner
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # 2. Join Tailscale network using OAuth client (recommended by Tailscale)
      - name: 2. Connect Runner to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # 3. Sync latest code to the VPS deployment directory over Tailscale
      - name: 3. Sync Repository Code to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TAILSCALE_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            TARGET_DIR="/opt/portfolio-telemetry"
            echo "[STEP 3] Connected via Tailscale to $(hostname). Updating code..."

            sudo mkdir -p "$TARGET_DIR"
            sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} "$TARGET_DIR"

            if [ -d "$TARGET_DIR/.git" ]; then
              cd "$TARGET_DIR"
              git fetch origin
              git reset --hard origin/${{ github.ref_name }} || git reset --hard origin/main
            else
              echo "[STEP 3] Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
              cd "$TARGET_DIR"
              git checkout ${{ github.ref_name }} || git checkout main
            fi

      # 4. Install production dependencies with Bun
      - name: 4. Install Bun Dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TAILSCALE_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            TARGET_DIR="/opt/portfolio-telemetry"
            echo "[STEP 4] Installing dependencies for services/telemetry..."
            cd "$TARGET_DIR/services/telemetry"

            export PATH="$HOME/.bun/bin:$PATH"
            bun install --production

      # 5. Install systemd service unit and restart daemon
      - name: 5. Configure & Restart Systemd Daemon
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TAILSCALE_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            TARGET_DIR="/opt/portfolio-telemetry"
            echo "[STEP 5] Deploying systemd unit..."

            sudo cp "$TARGET_DIR/services/telemetry/systemd/telemetry-api.service" /etc/systemd/system/telemetry-api.service
            sudo systemctl daemon-reload
            sudo systemctl enable telemetry-api
            sudo systemctl restart telemetry-api
            echo "[STEP 5] Daemon restarted successfully."

      # 6. Verify live healthcheck over Tailscale
      - name: 6. Verify Live Healthcheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TAILSCALE_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "[STEP 6] Waiting 3s for daemon warmup..."
            sleep 3

            echo "[STEP 6] Curler checking http://127.0.0.1:3001/health..."
            HEALTH_OUTPUT=$(curl -f -s http://127.0.0.1:3001/health) || {
              echo "[ERROR] Healthcheck failed! Fetching recent journalctl logs:"
              sudo journalctl -u telemetry-api -n 25 --no-pager
              exit 1
            }

            echo "[STEP 6] Healthcheck OK: $HEALTH_OUTPUT"
